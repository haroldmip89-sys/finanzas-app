name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The tests use an in-memory Postgres (PGlite): no database or secrets needed.
      - run: npm test
      # Placeholder values: the build only needs them to exist, nothing connects.
      - run: npm run build
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/finanzas
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder
